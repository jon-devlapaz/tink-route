name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Check tag matches pyproject version
      run: |
        ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        test "v$ver" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != pyproject v$ver"; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build
        (cd dist && sha256sum * > SHA256SUMS)

    - name: Attach distributions to the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
        gh release upload "${{ github.ref_name }}" dist/* --clobber
