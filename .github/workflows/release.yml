name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.5.3)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref_name }}

    - name: Check tag matches pyproject version
      env:
        REF_NAME: ${{ inputs.tag || github.ref_name }}
      run: |
        ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        test "v$ver" = "$REF_NAME" || { echo "tag $REF_NAME != pyproject v$ver"; exit 1; }

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build
        (cd dist && sha256sum * > SHA256SUMS)

    - name: Attach distributions to the release
      env:
        GH_TOKEN: ${{ github.token }}
        REF_NAME: ${{ inputs.tag || github.ref_name }}
      run: |
        gh release view "$REF_NAME" >/dev/null 2>&1 || gh release create "$REF_NAME" --title "$REF_NAME" --generate-notes
        gh release upload "$REF_NAME" dist/* --clobber
